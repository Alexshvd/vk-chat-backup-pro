<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вложения диалога — Архив ВК</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#222b38;background:#edeef0;font-size:14px;--blue:#447bba;--muted:#818c99}*{box-sizing:border-box}body{margin:0}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}.topbar{background:white;border-bottom:1px solid #dce1e6;padding:16px max(20px,calc((100vw - 1220px)/2));display:flex;gap:18px;flex-wrap:wrap}.topbar a:first-child{font-weight:650;margin-right:auto}.container{max-width:1220px;margin:22px auto;padding:0 20px}.head,.toolbar{background:white;border:1px solid #dce1e6;padding:20px;border-radius:12px;margin-bottom:14px}.head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.head>div{flex:1;min-width:180px}h1{font-size:22px;margin:0 0 8px}.subtitle{color:var(--muted);line-height:1.5}.button{border:1px solid #cfdae5;background:#fff;color:var(--blue);padding:9px 14px;border-radius:8px}.button:hover{background:#eff5fc;text-decoration:none}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:0;border-radius:7px;padding:9px 12px;background:#f3f5f7;color:#536577}.filter[aria-pressed=true]{color:#285c96;background:#e7f0fb;font-weight:600}.search{flex:1;min-width:220px;border:1px solid #dce1e6;border-radius:8px;padding:10px 12px}.search:focus{outline:2px solid #9dbbdf;outline-offset:1px}.results{color:var(--muted);font-size:13px;margin:18px 2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{background:#fff;border:1px solid #dce1e6;border-radius:12px;overflow:hidden;min-width:0;display:flex;flex-direction:column}.preview{height:210px;background:#f3f5f7;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:210px;object-fit:contain}.photo-button{width:100%;padding:0;border:0;background:none;display:block}.photo-button:hover{background:#e8eef5}.preview video{width:100%;height:210px;background:#192635}.preview audio{width:calc(100% - 24px)}.file-icon{font-size:32px;color:#7189a3;letter-spacing:1px}.body{padding:14px;display:flex;flex-direction:column;gap:9px;flex:1}.title{font-weight:600;line-height:1.45;overflow-wrap:anywhere}.filename{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}.badge{background:#eef4fb;color:#587b9e;padding:2px 6px;border-radius:4px}.actions{margin-top:auto;padding-top:5px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap}.uses{font-size:12px;color:#687a8e;line-height:1.6}.uses summary{cursor:pointer}.uses a{display:block;padding-top:3px}.empty{padding:45px 20px;text-align:center;background:white;border-radius:12px;color:var(--muted);line-height:1.7}.more{text-align:center;margin:24px 0}.lightbox{border:0;border-radius:12px;padding:14px;background:#18212c;color:white;max-width:95vw;max-height:95dvh}.lightbox::backdrop{background:#111b28cf}.lightbox img{display:block;max-width:88vw;max-height:78dvh;object-fit:contain;margin:auto}.lightbox header{display:flex;gap:18px;justify-content:space-between;align-items:center;margin-bottom:12px}.lightbox button{background:#ffffff15;color:white;border:0;border-radius:6px;padding:7px 12px}.lightbox a{color:#cce1ff}.error{color:#9d4141}@media(max-width:580px){.container{padding:0 12px;margin:14px auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.preview,.preview img,.preview video{height:150px}.body{padding:10px}.head,.toolbar{padding:14px}.search{min-width:0;width:100%;flex-basis:100%}.filter{padding:8px;font-size:12px}.preview audio{width:calc(100% - 8px)}h1{font-size:19px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
<style>.advanced-actions{position:relative}.advanced-actions summary{cursor:pointer;list-style:none}.advanced-actions p{position:absolute;right:0;z-index:20;width:240px;padding:14px;background:white;border:1px solid #cfdae5;border-radius:8px;box-shadow:0 4px 12px #0002;line-height:1.6}.file-details{font-size:12px;color:var(--muted)}.file-details summary{cursor:pointer}</style>
<link rel="stylesheet" href="{{ url_for('static', filename='navigation.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="has-app-navigation">
{% with active_page='dialogs' %}{% include 'navigation.html' %}{% endwith %}

<main class="container" data-peer="{{ peer_id }}" id="mediaLibrary">
  <header class="head"><div><h1 id="libraryTitle">Вложения диалога</h1><div class="subtitle" id="libraryStats" aria-live="polite">Загружаем библиотеку…</div></div><a class="button" href="/chat/{{ peer_id }}">← К переписке</a><details class="advanced-actions"><summary class="button">Дополнительно</summary><p><a href="/dialog/{{ peer_id }}">Редактор файлов</a><br>Переименование, перемещение и удаление файлов.</p></details></header>
  <div class="toolbar"><div class="filters" aria-label="Тип вложения"><button class="filter" data-type="all" aria-pressed="true">Все</button><button class="filter" data-type="photo" aria-pressed="false">Фото</button><button class="filter" data-type="video" aria-pressed="false">Видео</button><button class="filter" data-type="audio" aria-pressed="false">Аудио</button><button class="filter" data-type="file" aria-pressed="false">Документы</button></div><input class="search" id="mediaSearch" type="search" placeholder="Название, имя файла или номер сообщения" aria-label="Поиск вложений"><button class="button" id="mediaRefresh">Обновить</button></div>
  <div class="results" id="mediaResults" aria-live="polite"></div>
  <div id="mediaEmpty" class="empty" hidden></div>
  <div id="mediaGrid" class="grid"></div>
  <div class="more"><button class="button" id="mediaMore" hidden>Показать ещё</button></div>
</main>
<dialog id="mediaLightbox" class="lightbox"><header><span id="photoTitle"></span><a id="photoOriginal" target="_blank" rel="noopener">Открыть файл</a><button id="closeMediaPhoto" aria-label="Закрыть фото">Закрыть ×</button></header><img id="mediaPhoto" alt=""></dialog>
<script src="{{ url_for('static', filename='media-library.js') }}"></script>
</body>
</html>
